<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Soft shadow -->
  <ellipse cx="120" cy="204" rx="46" ry="10" fill="#16251F" fill-opacity="0.08"/>

  <!-- Soda Can Body -->
  <g transform="translate(120, 112) translate(-120, -112)">
    <!-- Top Rim Metallic -->
    <path d="M84 48 C84 43 156 43 156 48 L154 54 C154 56 86 56 86 54 Z" fill="#CCD5CA"/>
    <ellipse cx="120" cy="46" rx="36" ry="7" fill="#E4E9E0" stroke="#CCD5CA" stroke-width="1"/>
