    <text x="120" y="128" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="700" fill="#3D674B" text-anchor="middle" letter-spacing="0.5">ICE CREAM SODA</text>
    <path d="M120 89 L122 93 L126 94 L123 97 L124 101 L120 99 L116 101 L117 97 L114 94 L118 93 Z" fill="#2E6947"/>

