<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Soft shadow -->
  <ellipse cx="120" cy="205" rx="65" ry="12" fill="#16251F" fill-opacity="0.08"/>
  
  <!-- Tilted Notebook Group -->
  <g transform="translate(120, 115) rotate(-6) translate(-120, -115)">
    <!-- Back cover / depth -->
    <rect x="62" y="38" width="124" height="158" rx="14" fill="#0E1B15" />
    <!-- Front cover -->
    <rect x="58" y="34" width="122" height="158" rx="14" fill="#1F4738" stroke="#16362A" stroke-width="2"/>
    
    <!-- Spine band -->
    <rect x="58" y="34" width="22" height="158" rx="4" fill="#17382C"/>
    
    <!-- Spiral wire loops -->
    <g fill="#CBD5CE">
      <rect x="54" y="48" width="10" height="4" rx="2" fill="#E4E9E0" stroke="#88968C" stroke-width="0.8"/>
      <rect x="54" y="64" width="10" height="4" rx="2" fill="#E4E9E0" stroke="#88968C" stroke-width="0.8"/>
      <rect x="54" y="80" width="10" height="4" rx="2" fill="#E4E9E0" stroke="#88968C" stroke-width="0.8"/>
      <rect x="54" y="96" width="10" height="4" rx="2" fill="#E4E9E0" stroke="#88968C" stroke-width="0.8"/>
      <rect x="54" y="112" width="10" height="4" rx="2" fill="#E4E9E0" stroke="#88968C" stroke-width="0.8"/>
      <rect x="54" y="128" width="10" height="4" rx="2" fill="#E4E9E0" stroke="#88968C" stroke-width="0.8"/>
      <rect x="54" y="144" width="10" height="4" rx="2" fill="#E4E9E0" stroke="#88968C" stroke-width="0.8"/>
      <rect x="54" y="160" width="10" height="4" rx="2" fill="#E4E9E0" stroke="#88968C" stroke-width="0.8"/>
      <rect x="54" y="176" width="10" height="4" rx="2" fill="#E4E9E0" stroke="#88968C" stroke-width="0.8"/>
    </g>

    <!-- Center White/Cream Label -->
    <rect x="92" y="68" width="76" height="88" rx="8" fill="#F8F8F3" stroke="#E4E9E0" stroke-width="1.5"/>
    <text x="130" y="104" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#16251F" text-anchor="middle" letter-spacing="0.5">CAMPUS</text>
    <text x="130" y="122" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" font-weight="800" fill="#16251F" text-anchor="middle" letter-spacing="0.5">NOTES</text>
    
    <!-- Subtle notebook ruled lines on label -->
    <line x1="102" y1="134" x2="158" y2="134" stroke="#CBD5CE" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="102" y1="142" x2="148" y2="142" stroke="#CBD5CE" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
