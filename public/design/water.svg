<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Soft shadow -->
  <ellipse cx="120" cy="204" rx="44" ry="10" fill="#16251F" fill-opacity="0.08"/>

  <!-- Mineral Water Bottle -->
  <g transform="translate(120, 114) translate(-120, -114)">
    <!-- Blue Cap -->
    <rect x="108" y="38" width="24" height="12" rx="3" fill="#2E7EB8"/>
    <rect x="106" y="48" width="28" height="4" rx="1.5" fill="#2E7EB8"/>

    <!-- Neck tapered -->
    <path d="M110 52 L130 52 L142 80 L98 80 Z" fill="#D3E7F7" stroke="#A9D0EF" stroke-width="1"/>

    <!-- Main Cylinder -->
    <rect x="96" y="80" width="48" height="106" rx="12" fill="#D3E7F7" stroke="#A9D0EF" stroke-width="1"/>

    <!-- Water highlights -->
    <rect x="100" y="84" width="5" height="96" rx="2" fill="#FFFFFF" fill-opacity="0.5"/>

    <!-- White Wave Label -->
    <rect x="96" y="106" width="48" height="44" fill="#FFFFFF" fill-opacity="0.95"/>
    <!-- Wave lines -->
    <path d="M104 122 Q 112 118 120 122 T 136 122" stroke="#2E7EB8" stroke-width="2" fill="none"/>
    <path d="M104 128 Q 112 124 120 128 T 136 128" stroke="#68B5E8" stroke-width="1.5" fill="none"/>
    <text x="120" y="142" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="800" fill="#16251F" text-anchor="middle">AQUA 500ML</text>
  </g>
</svg>
