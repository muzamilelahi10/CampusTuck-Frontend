<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 400" fill="none">
  <!-- Glowing gradient background or subtle organic circle -->
  <circle cx="360" cy="180" r="160" fill="#244E3B" fill-opacity="0.6"/>
  <!-- Warm Peach cutout circle in background -->
  <circle cx="440" cy="90" r="42" fill="#F8A882" fill-opacity="0.9"/>
  <!-- Lime Accent Circle -->
  <circle cx="210" cy="290" r="18" fill="#D8EF72"/>

  <!-- Left Product Card: Pakola Ice Cream Soda -->
  <g transform="translate(190, 160)">
    <rect x="0" y="0" width="130" height="155" rx="20" fill="#E3F2E9"/>
    <!-- Small Pakola visual inside -->
    <!-- Can -->
    <rect x="45" y="32" width="40" height="70" rx="6" fill="#2E6947"/>
    <rect x="45" y="52" width="40" height="34" fill="#FFFFFF"/>
    <text x="65" y="72" font-family="'Plus Jakarta Sans', sans-serif" font-size="7" font-weight="900" fill="#2E6947" text-anchor="middle">PAKOLA</text>
    <ellipse cx="65" cy="30" rx="18" ry="4" fill="#CCD5CA"/>
    <ellipse cx="65" cy="102" rx="18" ry="4" fill="#CCD5CA"/>
    <!-- Card label -->
    <rect x="18" y="118" width="94" height="20" rx="6" fill="#FFFFFF"/>
    <text x="65" y="132" font-family="'Plus Jakarta Sans', sans-serif" font-size="9" font-weight="800" fill="#16251F" text-anchor="middle">Pakola • Rs. 90</text>
  </g>

  <!-- Right Floating Product Card: CUI Spiral Notebook (Tilted forward) -->
  <g transform="translate(300, 90) rotate(5)">
    <!-- Card base -->
    <rect x="0" y="0" width="165" height="195" rx="22" fill="#EBF3FA" stroke="#D7E7D2" stroke-width="1.5"/>
    
    <!-- Mini notebook inside -->
    <g transform="translate(30, 20) rotate(-6)">
      <rect x="0" y="0" width="85" height="110" rx="10" fill="#1F4738"/>
      <rect x="0" y="0" width="16" height="110" rx="3" fill="#17382C"/>
      <!-- center label -->
      <rect x="24" y="24" width="52" height="60" rx="6" fill="#F8F8F3"/>
      <text x="50" y="48" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#16251F" text-anchor="middle">CAMPUS</text>
      <text x="50" y="60" font-family="'Plus Jakarta Sans', sans-serif" font-size="8" font-weight="800" fill="#16251F" text-anchor="middle">NOTES</text>
      <!-- spirals -->
      <circle cx="-2" cy="18" r="2.5" fill="#E4E9E0"/>
      <circle cx="-2" cy="36" r="2.5" fill="#E4E9E0"/>
      <circle cx="-2" cy="54" r="2.5" fill="#E4E9E0"/>
      <circle cx="-2" cy="72" r="2.5" fill="#E4E9E0"/>
      <circle cx="-2" cy="90" r="2.5" fill="#E4E9E0"/>
    </g>

    <!-- Card label -->
    <rect x="22" y="150" width="120" height="24" rx="8" fill="#FFFFFF"/>
    <text x="82" y="166" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#16251F" text-anchor="middle">CUI Spiral Notebook</text>
  </g>

  <!-- Small floating cookie or chips accent tag -->
  <g transform="translate(130, 80) rotate(-10)">
    <circle cx="28" cy="28" r="26" fill="#E6A868"/>
    <circle cx="20" cy="20" r="3.5" fill="#382117"/>
    <circle cx="34" cy="22" r="3.5" fill="#382117"/>
    <circle cx="26" cy="34" r="3.5" fill="#382117"/>
  </g>
</svg>
